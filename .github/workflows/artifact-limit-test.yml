name: Diagnóstico — límite de tamaño de artefacto

# Prueba empírica: sube UN artefacto de ~6 GiB de datos aleatorios
# (incompresibles, para que el ZIP no los encoja) y confirma si
# upload-artifact@v4 acepta más de 5 GB por artefacto.
# Ubuntu runner = gratis en repos públicos. Retención 1 día.

on:
  workflow_dispatch:
    inputs:
      gb:
        description: "GiB de datos aleatorios a subir"
        required: false
        default: "6"
        type: string

permissions: {}

jobs:
  artifact-size-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Generar datos aleatorios incompresibles
        run: |
          set -euo pipefail
          GB="${{ inputs.gb }}"
          dd if=/dev/urandom of=random-data.bin bs=1M count=$((GB * 1024)) status=progress
          ls -la random-data.bin
          df -h .

      - name: Subir como UN único artefacto
        uses: actions/upload-artifact@v4
        with:
          name: random-${{ inputs.gb }}gb-test
          path: random-data.bin
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
