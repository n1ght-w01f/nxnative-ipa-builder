name: Compilar juego de Switch a IPA (nxnative)

# ---------------------------------------------------------------
# Esto nunca se sube con el repo: los archivos con copyright
# (.nsp / prod.keys) se descargan en tiempo de ejecución, se
# compilan en el runner y su resultado vive solo como artefacto
# de 1 día. El historial de Git queda limpio SIEMPRE.
# ---------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      nsp_url:
        description: "URL directa del juego base (opcional si usas el Secret NSP_URL)"
        required: false
        type: string
      extra_urls:
        description: "URLs de updates/DLC del MISMO juego, separadas por espacios"
        required: false
        default: ""
        type: string
      keys_url:
        description: "URL directa de prod.keys ('none' para ignorar el Secret — juegos Switch 2/NUP)"
        required: false
        default: ""
        type: string
      game_name:
        description: "Nombre identificador del juego"
        required: false
        default: "game"
        type: string
      language:
        description: "Idioma (ej. es, ja, en-GB; vacío = inglés)"
        required: false
        default: ""
        type: string
      package:
        description: "Versión a empaquetar (ej. v0; vacío = la más reciente)"
        required: false
        default: ""
        type: string
      gpu:
        description: "Archivos de pipeline GPU extra (ej. g18p,g17p; vacío = por defecto)"
        required: false
        default: ""
        type: string
      app_name:
        description: "Nombre en la pantalla de inicio (opcional)"
        required: false
        default: ""
        type: string
      show_fps:
        description: "Mostrar el contador de FPS en pantalla"
        required: false
        default: false
        type: boolean
      allow_other_metal:
        description: "Saltar la comprobación estricta del compilador Metal (último recurso)"
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: nxnative-build
  cancel-in-progress: false

jobs:
  build-ipa:
    name: Compilar y empaquetar IPA
    # Imagen "xcode-27": runner estándar ARM64 de Apple Silicon con
    # Xcode 27.2 (27B48), la versión que nxnative tiene testeada.
    # macos-latest solo trae Xcode 26.x y fallaría la comprobación de Metal.
    runs-on: xcode-27
    timeout-minutes: 360

    steps:
      # -------- 0. Resolver URLs (inputs visibles o Secrets) --------
      # En repos públicos, cualquiera puede VER los inputs de cada
      # ejecución en la pestaña Actions. Por eso se recomienda poner
      # las URLs en los Repository Secrets KEYS_URL / NSP_URL
      # (Settings → Secrets and variables → Actions): nunca se ven
      # ni en la interfaz ni en los logs (add-mask).
      - name: Resolver URLs de descarga
        id: urls
        env:
          NSP_URL: ${{ inputs.nsp_url || secrets.NSP_URL }}
          KEYS_URL: ${{ inputs.keys_url || secrets.KEYS_URL }}
        run: |
          set -euo pipefail
          # 'none' anula el Secret (para builds Switch 2 sin keys)
          if [ "$KEYS_URL" = "none" ]; then KEYS_URL=""; fi
          if [ -z "$NSP_URL" ]; then
            echo "::error::Falta la URL del juego. Pásala como input o como Secret NSP_URL."
            exit 1
          fi
          echo "NSP_URL=$NSP_URL" >> "$GITHUB_ENV"
          echo "KEYS_URL=$KEYS_URL" >> "$GITHUB_ENV"

      # -------- 1. Dependencias del sistema (brew) --------
      - name: Instalar dependencias del sistema
        run: |
          set -euo pipefail
          brew update --quiet
          brew install python cmake xcodegen zstd glslang
          brew install --cask dotnet-sdk || \
            echo "::warning::dotnet-sdk no se instaló vía brew; nxnative pedirá dependencias extra solo si las necesita"

      # -------- 2. Clonar SIEMPRE la última versión de nxnative --------
      # No se clona con el repo ni se cachea: en cada ejecución se
      # obtiene la rama main actual para no quedarnos atrás.
      - name: Clonar nxnative (última versión, en tiempo de ejecución)
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git clone --depth 1 https://github.com/seedds/nxnative.git nxnative_core

      # -------- 3. Dependencias de Python (venv efímero) --------
      - name: Instalar dependencias de Python
        run: |
          set -euo pipefail
          NXDIR="$GITHUB_WORKSPACE/nxnative_core"
          cd "$NXDIR"
          # venv para evitar el error "externally-managed-environment"
          # de los Python de Homebrew en los runners de macOS.
          python3 -m venv "$NXDIR/.venv"
          PIP="$NXDIR/.venv/bin/pip"
          "$PIP" install --upgrade pip --quiet
          if [ -f requirements.txt ]; then
            "$PIP" install -r requirements.txt --quiet
          fi
          # Dependencias declaradas por nxnative en su documentación
          "$PIP" install --quiet lz4 "capstone>=5,<6" fonttools nsz zbic \
            "backports.zstd; python_version < '3.14'"
          # El venv queda activo para los siguientes pasos del job
          echo "PATH=$NXDIR/.venv/bin:$PATH" >> "$GITHUB_ENV"

      # -------- 4. Xcode + Metal Toolchain --------
      - name: Preparar Xcode y compilar el Metal Toolchain
        run: |
          set -euo pipefail
          # Preferir explícitamente Xcode 27.2 (la que nxnative tiene
          # testeada: dmsh_chain.lock metalfe-32023.922.4)
          XCAPP=""
          for CAND in /Applications/Xcode_27.2*.app /Applications/Xcode-27.2.app; do
            [ -d "$CAND" ] && XCAPP="$CAND" && break
          done
          if [ -z "$XCAPP" ]; then
            XCAPP=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
            echo "::warning::No se encontró Xcode 27.2; usando $XCAPP (posible fallo de comprobación de Metal)"
          fi
          sudo xcode-select -s "$XCAPP"
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain || \
            echo "::warning::Metal Toolchain ya estaba presente o no se pudo precargar"

      # -------- 5. Libera espacio en el runner (juegos grandes) --------
      - name: Liberar espacio en disco
        run: |
          set -euo pipefail
          echo "[*] Espacio ANTES:"; df -h /
          # Xcodes que no usamos (cada uno ~11 GB). Se conserva el 27.2,
          # que es el seleccionado y el que nxnative tiene testeado.
          for XCAPP in /Applications/Xcode*.app; do
            case "$XCAPP" in
              *27.2*) echo "[*] Conservando $XCAPP" ;;
              *) echo "[*] Borrando $XCAPP"; rm -rf "$XCAPP" || true ;;
            esac
          done
          # SDKs y caches preinstaladas que nxnative no usa
          rm -rf "$HOME/Library/Android/sdk" \
                 /usr/local/lib/android \
                 /usr/share/dotnet \
                 /Users/runner/.cargo \
                 /Users/runner/.rustup \
                 /Library/Frameworks/Mono.framework \
                 /usr/local/share/edge_driver \
                 /usr/local/share/gecko_driver \
                 /usr/local/share/chromedriver \
                 /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          brew cleanup --prune-all >/dev/null 2>&1 || true
          echo "[*] Espacio DESPUÉS:"; df -h /

      # -------- 6. Descarga efímera de keys + juego(s) --------
      # Los ficheros bajados aquí JAMÁS se commitean a nada y el
      # runner entero se destruye al terminar el job.
      - name: Descargar prod.keys y el juego (efímero)
        env:
          EXTRA_URLS: ${{ inputs.extra_urls }}
        run: |
          set -euo pipefail
          NXDIR="$GITHUB_WORKSPACE/nxnative_core"

          # Enmascarar las URLs para que no aparezcan en los logs
          echo "::add-mask::$NSP_URL"
          echo "::add-mask::$KEYS_URL"
          echo "::add-mask::$EXTRA_URLS"

          # Nombre de juego seguro para rutas y artefactos
          RAW_NAME="${{ inputs.game_name }}"
          GAME=$(printf '%s' "$RAW_NAME" | tr -c 'A-Za-z0-9._-' '_' | sed -E 's/^\.+//;s/\.+$//')
          [ -n "$GAME" ] || GAME="game"

          EPHEMERAL="$NXDIR/.ephemeral"
          rm -rf "$EPHEMERAL"
          mkdir -p "$EPHEMERAL"

          # prod.keys (opcional: los juegos Switch 2 por NUP/dump no la necesitan)
          KEY_FILE=""
          if [ -n "$KEYS_URL" ]; then
            echo "[*] Descargando prod.keys ..."
            curl -L --fail --retry 3 --retry-delay 5 --connect-timeout 30 \
              -o "$EPHEMERAL/prod.keys" "$KEYS_URL"
            chmod 600 "$EPHEMERAL/prod.keys"
            KEY_FILE="$EPHEMERAL/prod.keys"
          else
            echo "[*] Sin prod.keys (correcto para NUP/dump de Switch 2; los NSP de Switch 1 sí la necesitan)"
          fi

          # Carpeta del juego: base + updates + DLC viven juntos aquí.
          # nxnative detecta las versiones por title ID de cada archivo.
          GAME_DIR="$EPHEMERAL/$GAME"
          mkdir -p "$GAME_DIR"

          fetch() {
            URL="$1"
            FILE=$(printf '%s' "$URL" | sed -E 's#.*/##' | sed -E 's/\?.*$//')
            # Decodificar %20, %5B, etc. para nombres reales
            FILE=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.unquote(sys.argv[1]))' "$FILE")
            case "$FILE" in
              *.nsp|*.nsz|*.xci|*.xcz|*.nup|*.zip) ;;
              *) FILE="download_$(echo "$URL" | cksum | cut -d' ' -f1).nsp" ;;
            esac
            echo "[*] Descargando ($FILE) ..."
            curl -L --fail --retry 3 --retry-delay 5 --connect-timeout 30 \
              -o "$GAME_DIR/$FILE" "$URL"
            # Un .zip se descomprime dentro de la carpeta del juego
            # (útil para volcar una carpeta base/ + updates/ + dlc/)
            case "$FILE" in
              *.zip)
                echo "[*] Descomprimiendo $FILE ..."
                unzip -q -o "$GAME_DIR/$FILE" -d "$GAME_DIR/"
                rm "$GAME_DIR/$FILE"
                ;;
            esac
          }

          fetch "$NSP_URL"
          for URL in $EXTRA_URLS; do
            fetch "$URL"
          done

          echo "[✔] Contenido de la carpeta del juego:"
          ls -la "$GAME_DIR"

          # Exportar variables para los siguientes pasos
          echo "GAME=$GAME" >> "$GITHUB_ENV"
          echo "GAME_DIR=$GAME_DIR" >> "$GITHUB_ENV"
          echo "KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
          echo "[✔] Descarga efímera completada"

      # -------- 6. Build / empaquetado oficial de nxnative --------
      - name: Compilar la IPA (nxnative)
        env:
          LANGUAGE: ${{ inputs.language }}
          PACKAGE: ${{ inputs.package }}
          GPU: ${{ inputs.gpu }}
          APP_NAME: ${{ inputs.app_name }}
          SHOW_FPS: ${{ inputs.show_fps }}
          ALLOW_OTHER_METAL: ${{ inputs.allow_other_metal }}
        run: |
          set -euo pipefail
          NXDIR="$GITHUB_WORKSPACE/nxnative_core"
          cd "$NXDIR"
          df -h /
          CMD=(python3 scripts/build_ipa_from_nsp.py "$GAME_DIR")
          if [ -n "$KEY_FILE" ]; then CMD+=(-k "$KEY_FILE"); fi
          if [ -n "$LANGUAGE" ]; then CMD+=(-l "$LANGUAGE"); fi
          if [ -n "$PACKAGE" ]; then CMD+=(-p "$PACKAGE"); fi
          if [ -n "$GPU" ]; then CMD+=(--gpu "$GPU"); fi
          if [ -n "$APP_NAME" ]; then CMD+=(--app-name "$APP_NAME"); fi
          if [ "$SHOW_FPS" = "true" ]; then CMD+=(--show-fps); fi
          if [ "$ALLOW_OTHER_METAL" = "true" ]; then CMD+=(--allow-other-metal); fi
          python3 -c 'print("CMD:", " ".join(__import__("shlex").quote(x) for x in __import__("sys").argv[1:]))' "${CMD[@]}" || true
          "${CMD[@]}"
          # La IPA "aparece en la carpeta del juego"

      # -------- 7. Mover la IPA y vaciar el runner --------
      # La IPA ya está construida: se saca del árbol de nxnative y se
      # borra TODO lo demás (NSPs de origen, juego extraído, venv,
      # repo completo). Eso libera ~30 GB para dividir con margen.
      - name: Mover la IPA y liberar espacio
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/ipa_stage/$GAME"
          rm -rf "$SRC"
          mkdir -p "$SRC"
          shopt -s nullglob
          IPAS=("$GAME_DIR"/*.ipa)
          if [ ${#IPAS[@]} -eq 0 ]; then
            mapfile -t IPAS < <(find "$GITHUB_WORKSPACE" -name '*.ipa' -not -path '*/ipa_out/*' -not -path '*/ipa_stage/*' 2>/dev/null)
          fi
          if [ ${#IPAS[@]} -eq 0 ]; then
            echo "::error::La build no ha generado ningún .ipa"
            exit 1
          fi
          for IPA in "${IPAS[@]}"; do
            mv "$IPA" "$SRC/$(basename "$IPA")"
          done
          # Borrar el proyecto nxnative completo (NSPs, extraído, venv)
          rm -rf "$GITHUB_WORKSPACE/nxnative_core"
          # Cachés de pipelines de Metal que el host deja en el sistema
          rm -rf "$(getconf DARWIN_USER_CACHE_DIR 2>/dev/null)/com.apple.gpuarchiver" 2>/dev/null || true
          echo "[✔] IPA(s) en stage, runner vaciado:"
          ls -la "$SRC"
          df -h /

      # -------- 8. Localizar y (si > 2 GB) dividir la IPA --------
      - name: "Empaquetar salida (dividir si supera 2 GB)"
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/ipa_out/$GAME"
          SRC="$GITHUB_WORKSPACE/ipa_stage/$GAME"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          # Buscar todas las IPA generadas
          shopt -s nullglob
          IPAS=("$SRC"/*.ipa)

          if [ ${#IPAS[@]} -eq 0 ]; then
            echo "[*] No estaban en el stage; buscando en todo el árbol ..."
            mapfile -t IPAS < <(find "$GITHUB_WORKSPACE" -name '*.ipa' -not -path '*/ipa_out/*' -not -path '*/ipa_stage/*' 2>/dev/null)
          fi

          if [ ${#IPAS[@]} -eq 0 ]; then
            echo "::error::No se ha encontrado ningún archivo .ipa tras la build"
            exit 1
          fi

          MAX=$(( 2 * 1024 * 1024 * 1024 ))  # 2 GB

          for IPA in "${IPAS[@]}"; do
            SIZE=$(stat -f %z "$IPA")
            GB=$(awk "BEGIN {printf \"%.2f\", $SIZE / 1073741824}")
            echo "[*] IPA encontrada: $(basename "$IPA") ($GB GB)"

            if [ "$SIZE" -gt "$MAX" ]; then
              echo "[*] Supera 2 GB → dividiendo en volúmenes ZIP de 2000 MB ..."
              cd "$OUT"
              IPA_NAME="$(basename "$IPA")"
              BASE="${IPA_NAME%.ipa}"
              mv "$IPA" "$IPA_NAME"
              zip -q -r "$IPA_NAME.zip" "$IPA_NAME"
              zip -q -s 2000m "$IPA_NAME.zip" --out "${BASE}_parts.zip"
              rm "$IPA_NAME" "$IPA_NAME.zip"
              echo "[✔] Partes generadas: $(ls "${BASE}_parts".zip* | tr '\n' ' ')"
            else
              mv "$IPA" "$OUT/$(basename "$IPA")"
              echo "[✔] IPA movida al stage de artefactos"
            fi
          done

          ls -la "$OUT"

      # -------- 8. Subir artefactos (un volumen por artefacto) --------
      # GitHub limita cada artefacto (~5-10 GB), así que cada volumen
      # del ZIP dividido se sube como artefacto propio (≤ 2 GB).
      # Retención 1 día: se borran solos.
      - name: "Artefacto: IPA (si no se dividió)"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.game_name }}-ipa
          path: 'ipa_out/**/*.ipa'
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
      - name: "Artefacto: vol01"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.game_name }}-vol01
          path: 'ipa_out/**/*_parts.zip.z01'
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
      - name: "Artefacto: vol02"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.game_name }}-vol02
          path: 'ipa_out/**/*_parts.zip.z02'
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
      - name: "Artefacto: vol03"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.game_name }}-vol03
          path: 'ipa_out/**/*_parts.zip.z03'
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
      - name: "Artefacto: vol04"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.game_name }}-vol04
          path: 'ipa_out/**/*_parts.zip.z04'
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
      - name: "Artefacto: vol05"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.game_name }}-vol05
          path: 'ipa_out/**/*_parts.zip.z05'
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
      - name: "Artefacto: vol06"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.game_name }}-vol06
          path: 'ipa_out/**/*_parts.zip.z06'
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
      - name: "Artefacto: vol07"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.game_name }}-vol07
          path: 'ipa_out/**/*_parts.zip.z07'
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
      - name: "Artefacto: vol08"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.game_name }}-vol08
          path: 'ipa_out/**/*_parts.zip.z08'
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
      - name: "Artefacto: vol09"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.game_name }}-vol09
          path: 'ipa_out/**/*_parts.zip.z09'
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
      - name: "Artefacto: vol10 (volumen final)"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.game_name }}-vol10
          path: 'ipa_out/**/*_parts.zip'
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
      - name: Verificar que hay salida
        run: |
          set -euo pipefail
          COUNT=$(ls -1 "$GITHUB_WORKSPACE/ipa_out/$GAME" 2>/dev/null | wc -l | tr -d ' ')
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No se subió ningún artefacto"
            exit 1
          fi
          echo "[✔] $COUNT archivo(s) subidos como artefacto(s)"

      # -------- 9. Limpieza defensiva --------
      # Borrar keys/juego/IPA del runner por si un fork del workflow
      # continúa después de este job. (igual los runners se destruyen,
      # esto es un doble seguro).
      - name: Limpieza efímera
        if: ${{ !cancelled() }}
        run: |
          rm -rf "$GITHUB_WORKSPACE/nxnative_core/.ephemeral" \
                 "$GITHUB_WORKSPACE/ipa_out" || true
